<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Untuk Saskia</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      font-weight: 600;
      overflow: hidden;
      background-color: #000;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .half {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background-image: url('done.jpg'); /* satu foto aja bro */
      background-size: 200% 100%;
      transition: all 1.2s ease-in-out;
      z-index: 2;
    }

    .left {
      left: 0;
      background-position: left center;
    }

    .right {
      right: 0;
      background-position: right center;
    }

    .open .left {
      transform: translateX(-100%);
    }

    .open .right {
      transform: translateX(100%);
    }

    .start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 32px;
      font-size: 20px;
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      z-index: 3;
      transition: background 0.3s ease;
    }

    .start-btn:hover {
      background-color: #ad1457;
    }

    .content {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 40px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: #fff;
      background: linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0.85));
      overflow-y: auto;
    }

    #teks {
      width: 100%;
      max-width: 800px;
      font-size: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    @media (max-width: 600px) {
      #teks {
        font-size: 16px;
        padding: 0 10px;
      }

      .start-btn {
        font-size: 16px;
        padding: 12px 24px;
      }
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

<div class="container" id="scene">
  <div class="half left"></div>
  <div class="half right"></div>
  <button class="start-btn" onclick="mulai()">💗 Buka Curhatan</button>

  <div class="content" id="konten">
    <div id="teks"></div>
  </div>

  <audio id="musik" autoplay loop>
    <source src="puisi.mp3" type="audio/mpeg" />
  </audio>
</div>

<script>
const teks = `
Saskia...

Hari ini aku nggak pengen ngasih kamu puisi indah. Aku cuma pengen cerita… dari hati. Dari seseorang yang jatuh cinta bukan karena alasan, tapi karena perasaan.

Aku masih inget, pertama kali kita saling sapa di aplikasi kecil itu… LICMATCH. Waktu itu aku nggak nyangka, dari sekadar match bisa berubah jadi rasa yang sedalam ini. Kamu bahkan belum tahu seberapa besar kamu ngubah hidupku sejak hari itu.

Dari awal kita ngobrol, ada hal yang berbeda. Kamu bukan cuma cantik — tapi kamu hangat. Tulus. Dan itu jarang banget aku temuin di dunia ini. Aku mulai nungguin notifikasi dari kamu tiap hari. Tiap malam aku tidur sambil baca ulang chat kita. Aku tahu, kedengerannya lebay... tapi itu kenyataannya.

Tapi di balik semua tawa kita di chat, aku punya satu rahasia:  
Aku diam-diam jatuh cinta. Bukan cinta yang instan, tapi cinta yang tumbuh... makin hari makin dalam.

Makanya aku mulai kerja lebih keras. Aku berani hujan-hujanan, panas-panasan, cari tambahan dari pagi sampai malam. Orang lihat aku gila kerja, padahal aku cuma punya satu alasan kuat:  
**Aku pengen cukup... buat bisa nyamperin kamu dan buktiin perasaan ini nyata.**

Banyak malam aku pulang capek, badan pegal, tapi senyum kamu di kepala aku cukup buat balikin semangat. Kamu itu alasanku bertahan, Saskia. Kamu itu tujuanku berdiri ketika dunia nyuruh aku rebah.

Aku nggak datang bawa mobil mewah. Aku nggak punya gaya keren atau saldo fantastis. Tapi aku punya satu hal yang aku jaga mati-matian: **ketulusan.**

Aku pernah gagal. Aku pernah ditinggal. Tapi kamu bikin aku percaya lagi.  
Dan aku cuma minta satu... satu kesempatan buat kamu ngerti:  
**Bahwa cinta itu bukan tentang seberapa sempurna aku. Tapi tentang seberapa keras aku berjuang buat kamu.**

Kalau kamu lagi baca ini, dan mungkin mulai netes air mata —  
Aku cuma pengen kamu tahu: itu bukan tujuan aku.  
Aku nggak pengen bikin kamu sedih...

Aku cuma pengen kamu ngerasain... bahwa ada seseorang di luar sana,  
Yang nggak pernah main-main sejak pertama nyebut namamu dalam doa.

Saskia...

Kalau hatimu masih sendiri, dan kamu juga ngerasa apa yang aku rasa —  
Aku bakal tunggu. Aku bakal terus berjuang.  
Sampai satu hari nanti aku bisa duduk di samping kamu, genggam tanganmu, dan bilang:

**"Akhirnya aku pulang... ke kamu."**

– Thelar
`;

let i = 0;
let speed = 70;

function mulai() {
  const scene = document.getElementById("scene");
  const konten = document.getElementById("konten");
  const musik = document.getElementById("musik");

  scene.classList.add("open");

  setTimeout(() => {
    document.querySelector(".start-btn").style.display = "none";
    konten.style.display = "flex";
    musik.play().catch(() => {});
    ketikHuruf();
  }, 1500);
}

function ketikHuruf() {
  const teksEl = document.getElementById("teks");
  if (i < teks.length) {
    teksEl.innerHTML += teks.charAt(i);
    i++;
    const konten = document.getElementById("konten");
    konten.scrollTop = konten.scrollHeight;
    setTimeout(ketikHuruf, teks.charAt(i) === '\n' ? 350 : speed);
  }
}
</script>

</body>
</html>
