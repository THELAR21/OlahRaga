<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Curhatan Thelar</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      font-weight: 600;
      background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      backdrop-filter: brightness(0.9);
    }

    h1 {
      text-align: center;
      color: #ffe4e1;
      font-size: 2.8em;
      margin-top: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 12px 28px;
      font-size: 18px;
      background-color: #e91e63;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #ad1457;
    }

    #container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      font-size: 20px;
      line-height: 1.8;
      white-space: pre-wrap;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      overflow-y: auto;
      height: calc(100vh - 200px);
    }

    audio {
      display: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2em; }
      #container { font-size: 17px; }
    }
  </style>
</head>
<body>

  <h1>Curhatan Untuk Saskia</h1>
  <button onclick="mulaiCurhat()">💔 Baca Curhatannya</button>

  <div id="container">
    <div id="puisi"></div>
  </div>

  <audio id="musik" autoplay loop>
    <source src="puisi.mp3" type="audio/mpeg" />
    Browser kamu tidak mendukung audio.
  </audio>

  <script>
    const teks = `
Saskia...

Aku cuma ingin jujur malam ini. Nggak pake indah-indah kata. Cuma curhatan dari hati seorang Thelar... yang selama ini diam.

Inget nggak pertama kali kita kenal? Dari aplikasi kecil itu, LICMATCH. Iseng awalnya, tapi pas lihat senyummu... entah kenapa dunia berhenti sebentar.  
Sejak saat itu, semuanya berubah buatku.

Mungkin kamu nggak sadar, tapi sejak hari itu... kamu udah punya ruang di pikiranku yang nggak bisa aku buang.

Hari-hari berlalu, kita saling sapa, saling cerita. Tapi di balik layar, aku mulai punya tujuan...

Aku pengen ketemu kamu. Bukan cuma di chat. Bukan cuma di foto.

Tapi buat ketemu kamu... aku harus kerja lebih keras. Aku harus bangkit dari capek yang nggak semua orang tahu.  
Panas yang bikin kulit terbakar, hujan yang bikin baju basah — semua itu aku hadapin dengan satu harapan: bisa lihat kamu senyum di depan mataku.

Aku bukan cowok hebat, bukan orang kaya. Tapi aku berjuang. Setiap tetes keringat itu buat satu hal:  
Supaya suatu hari... aku bisa datang ke hadapanmu dan bilang:  
**“Saskia, aku di sini. Aku serius. Aku pengen kamu.”**

Aku capek berpura-pura kuat kadang. Tapi aku bertahan. Karena kamu.  
Aku tahu mungkin kamu punya banyak pilihan. Tapi aku cuma mau kamu tahu...

**Aku nggak datang dengan janji-janji. Aku datang dengan bukti: perjuangan.**

Kalau kamu baca ini sampai habis, dan kamu nangis...  
Aku cuma mau bilang satu hal:

Bukan air mata itu yang aku kejar. Tapi **izin dari hatimu... untuk aku jaga selamanya.**

- Thelar
`;

    let i = 0;
    let speed = 70;

    function mulaiCurhat() {
      document.getElementById("puisi").innerHTML = "";
      i = 0;
      ketikHuruf();
      document.getElementById("musik").play().catch(() => {});
    }

    function ketikHuruf() {
      if (i < teks.length) {
        const puisiDiv = document.getElementById("puisi");
        puisiDiv.innerHTML += teks.charAt(i);
        i++;

        // Scroll otomatis
        const container = document.getElementById("container");
        container.scrollTop = container.scrollHeight;

        setTimeout(ketikHuruf, teks.charAt(i) === '\n' ? 350 : speed);
      }
    }
  </script>

</body>
</html>
